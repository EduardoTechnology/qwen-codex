services:
  qwen35-vllm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    runtime: nvidia
    ipc: host
    ports:
      - "${QWEN_VLLM_HOST_PORT:-8002}:8000"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      CUDA_VISIBLE_DEVICES: "0"
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
      HF_HUB_ETAG_TIMEOUT: "30"
      VLLM_WORKER_MULTIPROC_METHOD: spawn
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ~/.cache/vllm:/root/.cache/vllm
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/v1/models >/dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 600s
      retries: 20
    entrypoint: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
    command:
      - --model
      - ${VLLM_MODEL_REPO:-QuantTrio/Qwen3.5-9B-AWQ}
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME:-qwen35-local}
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - ${VLLM_TOOL_CALL_PARSER:-qwen3_coder}
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      - --generation-config
      - vllm
      - --attention-backend
      - ${VLLM_ATTENTION_BACKEND:-TRITON_ATTN}
      - --mm-encoder-attn-backend
      - ${VLLM_MM_ENCODER_ATTN_BACKEND:-TRITON_ATTN}
      - --quantization
      - ${VLLM_QUANTIZATION:-awq}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-32768}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      - --max-num-batched-tokens
      - ${VLLM_MAX_BATCHED_TOKENS:-1024}
      - --max-num-seqs
      - "1"
      - --enforce-eager
      - --language-model-only
      - --disable-custom-all-reduce
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
