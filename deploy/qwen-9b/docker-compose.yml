services:
  qwen-codex-model:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    runtime: nvidia
    ipc: host
    ports:
      - "8002:8000"
    volumes:
      - qwen_huggingface_cache:/root/.cache/huggingface
      - qwen_vllm_cache:/root/.cache/vllm
    environment:
      HF_HOME: /root/.cache/huggingface
      NVIDIA_VISIBLE_DEVICES: all
      CUDA_VISIBLE_DEVICES: "0"
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "300"
      HF_HUB_ETAG_TIMEOUT: "60"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/v1/models >/dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 600s
      retries: 20
    entrypoint: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
    # To try a lighter model, change only --model first and keep
    # --served-model-name qwen35-local so qwen-codex does not need another env var.
    command:
      - --model
      - QuantTrio/Qwen3.5-9B-AWQ
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --served-model-name
      - qwen35-local
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      - --generation-config
      - vllm
      - --attention-backend
      - TRITON_ATTN
      - --quantization
      - awq
      - --max-model-len
      - "32768"
      - --gpu-memory-utilization
      - "0.90"
      - --max-num-batched-tokens
      - "1024"
      - --max-num-seqs
      - "1"
      - --enforce-eager
      - --language-model-only

volumes:
  qwen_huggingface_cache:
  qwen_vllm_cache:
